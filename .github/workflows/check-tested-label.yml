name: "Check for tested label (upstream - disabled)"

# Disabled in deployer fork: not needed for deployer workflow.
# Kept for merge compatibility with upstream valtimo repo.
permissions:
    contents: read

on:
    workflow_dispatch:

jobs:
    label-check:
        name: PR must have "tested" label
        runs-on: ubuntu-latest

        steps:
            - name: Check for label
              uses: actions/github-script@v7
              with:
                  script: |
                      const labels = await github.rest.issues.listLabelsOnIssue({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number
                      });

                      const hasTested = labels.data.some(label => label.name === 'tested');
                      if (!hasTested) {
                        core.setFailed('Missing required "tested" label on the PR.');
                      }