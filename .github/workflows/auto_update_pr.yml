name: "Auto-update PRs (upstream - disabled)"

# Disabled in deployer fork: relies on upstream GitHub App secrets.
# Kept for merge compatibility with upstream valtimo repo.
on:
  workflow_dispatch:
jobs:
  autoupdate:
    name: autoupdate
    runs-on: ubuntu-22.04
    steps:
      - name: Generate token as GitHub App
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.VALTIMO_PLATFORM_APP_APPID }}
          private_key: ${{ secrets.VALTIMO_PLATFORM_APP_PRIVATE_KEY }}
      - uses: docker://chinthakagodawita/autoupdate-action:v1
        with:
          include_drafts: true
        env:
          GITHUB_TOKEN: '${{ steps.generate_token.outputs.token }}'
